    q: What time do my bins need to be out?
    doc: bury-waste-collection-days
    must: [["7am", "7 am"]]
    must_not: ["6am", "6:30am"]
  - id: b04
    q: My bin was missed today. When can I report it?
    doc: bury-waste-missed-bin
    must: [["5pm", "5 pm"], ["1pm", "1 pm"]]
    must_not: ["48 hours"]
  - id: b05
    q: How much is a bulky waste collection?
    doc: bury-waste-bulky
    must: [["£49"]]
    must_not: ["£27", "two free"]
  - id: b06
    q: What phone number do I call to pay my council tax by card?
    doc: bury-council-tax-pay
    must: [["0300 456 0542"]]
    must_not: ["01942 489006"]
