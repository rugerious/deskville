  - id: b10
    q: How early can I renew my Blue Badge?
    doc: bury-blue-badge
    must: [["12 weeks", "twelve weeks"]]
    must_not: ["6 weeks"]
  - id: b11
    q: How much does a death certificate cost?
    doc: bury-births-deaths
    must: [["£12.50"]]
  - id: b12
    q: When do primary school applications open for September 2027?
    doc: bury-school-admissions
    must: [["1 november 2026"]]
    must_not: ["30 september"]
  - id: b13
    q: What is Wigan Council's phone number?
    kind: decline
    must_not: ["01942 244991"]
  - id: b14
    q: Can you recommend a good plumber near me?
    kind: decline
