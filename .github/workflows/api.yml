name: api

# Layer 5.1: the API's security tests on every PR, against a real PostgreSQL +
# pgvector with the project's own migrations and data. No AWS, no secrets:
# tokens are signed with a key pair generated inside the test, and search uses
# fake (word-hash) vectors instead of Bedrock.
# Layer 5.2: after a merge to main, once the tests pass and after approval in the
# 'production' environment, the image is built natively on an ARM runner, pushed
# to ECR tagged with the commit, and its vulnerability scan must show no CRITICAL.

on:
  pull_request:
    paths: ["api/**", "db/**", "ingest/**", "content/**", ".github/workflows/api.yml"]
  push:
    branches: [main]
    paths: ["api/**", "db/**", "ingest/**", "content/**", ".github/workflows/api.yml"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg18
        env:
          POSTGRES_USER: deskville_admin
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: deskville
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U deskville_admin -d deskville"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: deskville
    steps:
      - uses: actions/checkout@v7
      - name: psql wrapper (admin) for the project's scripts
        run: |
          printf '#!/bin/sh\nPGUSER=deskville_admin PGPASSWORD=ci-only-not-a-secret exec psql "$@"\n' > /tmp/psql-admin
          chmod +x /tmp/psql-admin
      - name: schema (migrations 001-005, as on RDS)
        run: |
          /tmp/psql-admin -X -q -v ON_ERROR_STOP=1 -c "CREATE ROLE rds_iam"
          for m in db/migrations/*.sql; do
            /tmp/psql-admin -X -q -v ON_ERROR_STOP=1 --single-transaction -f "$m" && echo "apply $(basename "$m")"
          done
          # CI only: on RDS deskville_app has no password (IAM tokens only).
          /tmp/psql-admin -X -q -c "ALTER ROLE deskville_app PASSWORD 'ci-only-not-a-secret'"
      - name: data (service requests + chunks with fake vectors)
        env:
          PSQL: /tmp/psql-admin
          DESKVILLE_PSQL: /tmp/psql-admin
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q -r api/requirements-dev.txt
          scripts/db-seed-requests.sh
          /tmp/venv/bin/python api/tests/load_fake.py
      - name: API security tests
        working-directory: api
        env:
          DESKVILLE_TEST_DB: "host=localhost port=5432 dbname=deskville user=deskville_app"
          PGPASSWORD: ci-only-not-a-secret
        run: /tmp/venv/bin/python -m unittest -v tests.test_api

  image:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04-arm
    environment: production
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: eu-west-2
      REPO: deskville-api
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: mask the account ID in this public log
        run: echo "::add-mask::$(aws sts get-caller-identity --query Account --output text)"
      - name: registry exists (created by the foundation apply)
        id: repo
        run: |
          uri=$(aws ecr describe-repositories --repository-names "$REPO" --query 'repositories[0].repositoryUri' --output text) \
            || { echo "::error::ECR repository $REPO not found: approve and finish the terraform apply first, then re-run this job"; exit 1; }
          echo "uri=$uri" >> "$GITHUB_OUTPUT"
      - name: build (arm64, native)
        working-directory: api
        run: |
          tag="${GITHUB_SHA::12}"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          docker build --pull -t "${{ steps.repo.outputs.uri }}:$tag" .
          docker image inspect "${{ steps.repo.outputs.uri }}:$tag" --format 'architecture: {{.Architecture}}, size: {{.Size}} bytes, user: {{.Config.User}}'
      - name: "push (tags are immutable, so a re-run finds it already there)"
        run: |
          if aws ecr describe-images --repository-name "$REPO" --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "$REPO:$TAG already in ECR, not pushed again"; exit 0
          fi
          aws ecr get-login-password | docker login --username AWS --password-stdin "${{ steps.repo.outputs.uri }}" >/dev/null
          docker push "${{ steps.repo.outputs.uri }}:$TAG" | tail -1
      - name: vulnerability scan (fail on CRITICAL)
        run: |
          # Scan-on-push starts a little after the push: until then ECR answers
          # "scan not found", which the waiter treats as a failure. Ask the findings
          # call itself and wait only while it says exactly that (describe-images
          # does not report the scan status in this account: found on 25 Nov).
          for i in $(seq 1 30); do
            if aws ecr describe-image-scan-findings --repository-name "$REPO" --image-id imageTag="$TAG" >/dev/null 2>/tmp/scan.err; then
              break
            elif grep -q ScanNotFoundException /tmp/scan.err; then
              echo "waiting for the scan to start ($i/30)"; sleep 10
            else
              cat /tmp/scan.err; exit 1
            fi
          done
          aws ecr wait image-scan-complete --repository-name "$REPO" --image-id imageTag="$TAG"
          echo "HIGH findings, for the record:"
          aws ecr describe-image-scan-findings --repository-name "$REPO" --image-id imageTag="$TAG" \
            --query "imageScanFindings.findings[?severity=='HIGH'].[name, attributes[?key=='package_name'].value | [0]]" --output text || true
          aws ecr describe-image-scan-findings --repository-name "$REPO" --image-id imageTag="$TAG" \
            --query 'imageScanFindings.findingSeverityCounts' --output json | tee /tmp/counts.json
          crit=$(python3 -c "import json;print(json.load(open('/tmp/counts.json') or {}).get('CRITICAL',0))" 2>/dev/null || echo 0)
          echo "image $REPO:$TAG scanned: CRITICAL=$crit"
          [ "$crit" = "0" ] || { echo "::error::$crit CRITICAL finding(s)"; exit 1; }
