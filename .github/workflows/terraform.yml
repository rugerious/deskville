name: terraform

# Pull request -> plan (read-only role) for every CI-managed stack.
# Merge to main -> plan + apply in the 'production' environment (manual approval),
# then a second plan that must say "No changes" -- for ALWAYS-ON stacks only.
# Expensive stacks (database) are planned on PRs but switched on and off only by
# the manual 'lab' workflow, never by a merge.
# The bootstrap and ci stacks are applied from the laptop only and never run here.
# Content (content/<tenant>/*.md) is copied to the content bucket after an approved
# apply, so a document only reaches AWS through a reviewed and approved merge.

on:
  pull_request:
    paths:
      - "infra/foundation/**"
      - "infra/database/**"
      - ".github/workflows/terraform.yml"
      - ".terraform-version"
  push:
    branches: [main]
    paths:
      - "infra/foundation/**"
      - "content/**"
      - ".github/workflows/terraform.yml"
      - ".terraform-version"

permissions: {}

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        stack: [foundation, database]
    defaults:
      run:
        working-directory: infra/${{ matrix.stack }}
    env:
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v7
      - id: tfver
        working-directory: .
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.tfver.outputs.version }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: mask the account ID in this public log
        run: echo "::add-mask::$(aws sts get-caller-identity --query Account --output text)"
      - name: fmt
        run: terraform fmt -check -recursive
      - name: init
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
      - name: validate
        run: terraform validate -no-color
      - name: plan
        run: terraform plan -no-color -lock-timeout=60s

  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    strategy:
      max-parallel: 1
      matrix:
        stack: [foundation]
    defaults:
      run:
        working-directory: infra/${{ matrix.stack }}
    env:
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v7
      - id: tfver
        working-directory: .
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.tfver.outputs.version }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: mask the account ID in this public log
        run: echo "::add-mask::$(aws sts get-caller-identity --query Account --output text)"
      - name: init
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
      - name: plan
        run: terraform plan -no-color -lock-timeout=60s -out=apply.tfplan
      - name: apply
        run: terraform apply -no-color -lock-timeout=60s apply.tfplan
      - name: no drift after apply
        run: terraform plan -no-color -lock-timeout=60s -detailed-exitcode
      - name: sync content to S3 (one prefix per council)
        if: matrix.stack == 'foundation'
        run: |
          bucket="$(terraform output -raw content_bucket)"
          for dir in "$GITHUB_WORKSPACE"/content/*/; do
            tenant="$(basename "$dir")"
            aws s3 sync "$dir" "s3://$bucket/$tenant/docs/" --delete \
              --exclude "*" --include "*.md" --only-show-errors
            echo "$tenant: $(aws s3 ls "s3://$bucket/$tenant/docs/" | wc -l) documents in S3"
          done
